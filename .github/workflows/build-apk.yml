name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "arena/*" ]
    paths: [ "android/**", ".github/workflows/build-apk.yml" ]

permissions:
  contents: write   # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew || true

      - name: Unit tests (discovery logic: filters, dates, parsing)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/TenderBase-debug.apk
          ls -la ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-debug-apk
          path: out/TenderBase-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TenderBase debug APK (latest)
          body: |
            Latest installable debug build of the TenderBase Android app.
            Download **TenderBase-debug.apk** below and open it on your phone
            (enable "Install unknown apps" for your browser/file manager).
          files: out/TenderBase-debug.apk
          make_latest: true
