plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.tenderbase.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tenderbase.app"
        minSdk 24
        targetSdk 34
        // 1.2.1 = Sprint 0+1 onboarding-repair build (diagnostics-enabled).
        versionCode 4
        versionName "1.2.1"
        vectorDrawables { useSupportLibrary true }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            // Sprint 11: real release hardening — shrink + obfuscate.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so `assembleRelease` produces an
            // installable APK from CI without secrets; swap in a dedicated
            // signing config before Play Store upload.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        // Kotlin 1.9.24 -> Compose compiler 1.5.14 (required pairing).
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ---- Compose + Material 3 (redesign; BOM pins all Compose artifacts) ----
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Room Database
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Local unit tests (pure JVM: filters, dates, JSON parsing, onboarding logic).
    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM (the android.jar stub throws "not mocked").
    testImplementation 'org.json:json:20240303'

    // On-device UI tests (Sprint 0 quality gate; the BOM above pins versions).
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// The 1.2 CI pipeline (GitHub Actions) only invokes assembleDebug; gate it on
// the pure-JVM unit tests so a red test can never ship an APK.
tasks.configureEach { t ->
    if (t.name == "assembleDebug") {
        t.dependsOn("testDebugUnitTest")
    }
}
