# ============================================================================
# PROPOSED REPLACEMENT for .github/workflows/build-apk.yml  (Sprint 0 gate)
#
# ⚠️ ACTION REQUIRED (repo owner): GitHub Apps/bots may not modify workflow
# files, so this could not be pushed by the automation. To enable the
# quality gate, replace the workflow manually — GitHub web UI:
#   .github/workflows/build-apk.yml → Edit → paste this entire file → Commit.
#
# What changes vs the current workflow:
#   1. NEW JOB `android-test`: runs the onboarding golden-path Compose UI
#      test on real Android emulators (API 26 / 29 / 34). The APK is only
#      built/published when every API level passes — the class of crash that
#      hit users (UI code never executed in CI) now blocks publication.
#   2. The debug APK build runs only after the gate is green.
# ============================================================================
name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ "arena/01a056f1-tenderbase", "arena/01a04c59-tenderbase", "main" ]
    paths: [ "android/**", ".github/workflows/build-apk.yml" ]

permissions:
  contents: write   # needed to publish the Release

jobs:
  # ---------------------------------------------------------------- gate
  # On-device verification BEFORE any APK gets published. The reported
  # onboarding crash shipped because nothing ever executed the UI; this job
  # makes every future UI crash a CI failure instead of a user failure.
  android-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew || true

      - name: Run onboarding golden-path UI tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- build
  build:
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew || true

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/TenderBase-debug.apk
          ls -la ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-debug-apk
          path: out/TenderBase-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TenderBase debug APK (latest)
          body: |
            Latest installable debug build of the TenderBase Android app.
            Download **TenderBase-debug.apk** below and open it on your phone
            (enable "Install unknown apps" for your browser/file manager).

            **1.2.1 — onboarding repair build:** if you had a crash finishing
            onboarding, this is the fix. If anything still goes wrong:
            More → Settings → **Share diagnostics** sends us the crash report.
          files: out/TenderBase-debug.apk
          make_latest: true
