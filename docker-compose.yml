# One command to start the full development environment:
#   docker compose up --build
#
# Services: PostgreSQL (db), the API (which hosts the scheduler), and Nginx as
# the reverse proxy. Redis is included but commented out — enable it only when
# you actually introduce caching/queues (the app does not require it).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender}
      POSTGRES_DB: ${POSTGRES_DB:-tenderbase}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Compose wiring overrides .env host so the API reaches the db service.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD:-tender}@db:5432/${POSTGRES_DB:-tenderbase}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      # Readiness (db + wiring) rather than bare liveness.
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Dedicated scheduler worker. Enable with: docker compose --profile worker up
  # (and set SYNC_ENABLED=false on the api service to avoid double syncing).
  worker:
    build: .
    command: ["worker"]
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD:-tender}@db:5432/${POSTGRES_DB:-tenderbase}
      SYNC_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Redis for future caching/queues. Not required by V1.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  pgdata:
