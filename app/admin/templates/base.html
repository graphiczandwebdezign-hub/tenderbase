<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Tender API Admin{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --fg:#f1f5f9;
            --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--fg); }
    header { display:flex; align-items:center; justify-content:space-between;
             padding:16px 28px; background:#0b1220; border-bottom:1px solid #1e293b; }
    header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
    header .sub { color:var(--muted); font-size:13px; }
    a { color: var(--accent); text-decoration:none; }
    main { padding: 28px; max-width: 1100px; margin: 0 auto; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid #334155; border-radius:12px; padding:18px; }
    .card .k { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
    .card .v { font-size:30px; font-weight:700; margin-top:6px; }
    .section { margin-top:32px; }
    .section h2 { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid #334155; font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
    .badge { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; }
    .b-SUCCESS { background:rgba(34,197,94,.15); color:var(--ok); }
    .b-RUNNING { background:rgba(56,189,248,.15); color:var(--accent); }
    .b-PARTIAL { background:rgba(245,158,11,.15); color:var(--warn); }
    .b-FAILED { background:rgba(239,68,68,.15); color:var(--err); }
    button, .btn { background:var(--accent); color:#04222f; border:0; padding:10px 18px;
             border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }
    .btn-ghost { background:transparent; border:1px solid #334155; color:var(--fg); }
    input[type=password] { width:100%; padding:12px; border-radius:8px; border:1px solid #334155;
             background:#0b1220; color:var(--fg); font-size:15px; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SA Tender API — Admin</h1>
      <div class="sub">Data infrastructure monitoring</div>
    </div>
    <div>{% block nav %}{% endblock %}</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
