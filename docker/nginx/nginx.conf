# Reverse proxy for the SA Tender API.
# In production, terminate TLS here (see the commented 443 server block) and
# point it at your certificate files (e.g. from certbot / Let's Encrypt).

upstream tender_api {
    server api:8000;
}

# Basic rate limiting at the edge (application-level limits also apply).
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS in production once certs are configured:
    # return 301 https://$host$request_uri;

    client_max_body_size 4m;

    location /health {
        proxy_pass http://tender_api/health;
        access_log off;
    }

    location / {
        limit_req zone=api_edge burst=40 nodelay;

        proxy_pass http://tender_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

