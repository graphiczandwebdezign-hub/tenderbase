# Render Blueprint for the SA Tender API.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# It provisions a managed PostgreSQL database and a web service, wires the
# DATABASE_URL automatically, and generates API_KEY / ADMIN_SECRET for you.
#
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: tenderbase-db
    databaseName: tenderbase
    user: tender
    plan: free            # upgrade to a paid plan for production/persistence

services:
  - type: web
    name: tenderbase-api
    runtime: python
    plan: free            # NOTE: free web services sleep when idle (see README)
    branch: arena/01a04c59-tenderbase
    buildCommand: "pip install -r requirements.txt"
    # Render injects $PORT; migrations run before the server starts.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Wire the database connection string from the managed DB above.
      - key: DATABASE_URL
        fromDatabase:
          name: tenderbase-db
          property: connectionString
      # Auto-generated secrets — you never see or type these; rotate anytime.
      - key: API_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      # In-process scheduler. On the FREE plan the service sleeps when idle, so
      # the scheduler pauses too — either upgrade to a paid instance, or set
      # SYNC_ENABLED=false and use a cron pinging POST /api/v1/admin/sync.
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_MINUTES
        value: "15"
      - key: TENDER_RETENTION_DAYS
        value: "7"
      # Never load bundled dev sample data in production.
      - key: INGESTION_ALLOW_SAMPLE_FALLBACK
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"
      - key: CORS_ORIGINS
        value: "*"
